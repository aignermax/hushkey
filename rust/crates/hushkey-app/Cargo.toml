[package]
name = "hushkey-app"
description = "hushkey as a desktop app on the Rust core: hold a key, speak, release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "hushkey"
path = "src/main.rs"

[features]
default = ["download"]
vulkan = ["hushkey-core/vulkan"]
metal = ["hushkey-core/metal"]
cuda = ["hushkey-core/cuda"]
download = ["hushkey-core/download"]

[dependencies]
hushkey-core.workspace = true
hushkey-brain.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
png = "0.18"
sha2 = "0.10"
ureq.workspace = true

[build-dependencies]
png = "0.18"
ico = "0.4"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }
