[package]
name = "hushkey-app"
description = "hushkey as a desktop app on the Rust core: hold a key, speak, release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "hushkey"
path = "src/main.rs"

[features]
default = ["download"]
vulkan = ["hushkey-core/vulkan"]
metal = ["hushkey-core/metal"]
cuda = ["hushkey-core/cuda"]
download = ["hushkey-core/download"]

[dependencies]
hushkey-core.workspace = true
hushkey-brain.workspace = true
hushkey-net.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
png = "0.18"
sha2 = "0.10"
ureq.workspace = true
# Updates come xz-compressed (pure Rust: no C library to build).
lzma-rs = "0.3"

[build-dependencies]
png = "0.18"
ico = "0.4"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
tray-icon = "0.26"
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
# tray-icon's menu needs GTK on the main thread; the overlay is a GTK window
# too. Same version as tray-icon's.
gtk = "0.18"
# The key from /dev/input, and a uinput keyboard for the paste chord.
evdev = "0.13"
arboard = { version = "3", default-features = false }
x11rb = { version = "0.13", features = ["xinput", "xtest"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Direct3D settings UI, including the Windows software renderer; independent
# of the optional Whisper GPU backend.
eframe = { version = "0.31.1", default-features = false, features = ["wgpu"] }
wgpu = { version = "24", default-features = false, features = ["dx12"] }
pollster = "0.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_Security",
] }

# The versions tray-icon already uses, so there is one objc2 in the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
libc = "0.2"
