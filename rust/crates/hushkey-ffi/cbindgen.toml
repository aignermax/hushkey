language = "C"
include_guard = "HUSHKEY_H"
autogen_warning = "/* Generated by cbindgen from crates/hushkey-ffi; do not edit. */"
documentation = true
documentation_style = "c99"
style = "type"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[export]
prefix = ""

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[fn]
sort_by = "None"
