[workspace]
resolver = "2"
members = ["crates/hushkey-core", "crates/hushkey-brain", "crates/hushkey-ffi", "crates/hushkey-cli", "crates/hushkey-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
repository = "https://github.com/aignermax/hushkey"

[workspace.dependencies]
hushkey-core = { path = "crates/hushkey-core" }
hushkey-brain = { path = "crates/hushkey-brain" }
whisper-rs = "0.16"
cpal = "0.18"
hound = "3.5"
thiserror = "2"
dirs = "7"
ureq = "3"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
