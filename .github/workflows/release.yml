name: release

# The Rust app for every system, attached to the release of a v* tag
# (a pre-release when the tag has a suffix: v0.11.0-rc.1). The app updates
# itself from these assets, and install.ps1 / install.sh download them.
# Pull requests that touch the build, and runs by hand (workflow_dispatch),
# build without publishing.

permissions:
  contents: write  # attaching the assets to the release

on:
  push:
    tags: ["v*"]
  # A trial build (nothing published) when the build itself changes.
  pull_request:
    paths: [".github/workflows/release.yml", "rust/packaging/**", "rust/Cargo.toml", "rust/crates/hushkey-app/**"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, asset: hushkey-windows-x86_64.exe, features: vulkan}
          # 22.04: the binary then runs on glibc 2.35 and newer
          - {os: ubuntu-22.04, asset: hushkey-linux-x86_64, features: vulkan}
          - {os: ubuntu-22.04-arm, asset: hushkey-linux-aarch64, features: vulkan}
          - {os: macos-15, asset: hushkey-macos-arm64.zip, features: metal}
          - {os: macos-15-intel, asset: hushkey-macos-x86_64.zip, features: metal}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Portable whisper.cpp: the CPU code must run on any user's machine,
      # not just on the runner's.
      GGML_NATIVE: "OFF"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Version matches the tag
        if: github.ref_type == 'tag'
        run: |
          crate=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          test "v$crate" = "${GITHUB_REF_NAME}" || { echo "rust/Cargo.toml has $crate, tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev libasound2-dev libssl-dev pkg-config \
            libclang-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libudev-dev

      - uses: actions/cache/restore@v4
        id: shader-cache
        if: runner.os == 'Linux'
        with:
          path: .shader-tools
          key: shaderc-2025.1-vulkan-1.4.321-ubuntu22-${{ runner.arch }}-v1

      - name: Shader compiler (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/build-linux-shaders.sh

      - uses: actions/cache/save@v4
        if: runner.os == 'Linux' && steps.shader-cache.outputs.cache-hit != 'true'
        with:
          path: .shader-tools
          key: shaderc-2025.1-vulkan-1.4.321-ubuntu22-${{ runner.arch }}-v1

      - name: Vulkan SDK and libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk ninja -y --no-progress
          $sdk = (Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          # whisper.cpp's nested shader build overflows MAX_PATH under the
          # checkout; Ninja and a short target folder keep it short.
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=C:/t" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build
        working-directory: rust
        # PowerShell: in Git Bash, coreutils' link.exe shadows MSVC's linker.
        shell: pwsh
        run: cargo build --release -p hushkey-app --features ${{ matrix.features }}

      - name: Package
        run: |
          mkdir -p dist
          target="${CARGO_TARGET_DIR:-rust/target}"
          case "${{ runner.os }}" in
            Windows) cp "$target/release/hushkey.exe" "dist/${{ matrix.asset }}" ;;
            Linux)   cp "$target/release/hushkey" "dist/${{ matrix.asset }}" ;;
            macOS)
              bash rust/packaging/macos/make-app.sh "$target/release/hushkey" dist
              (cd dist && ditto -c -k --keepParent hushkey.app "${{ matrix.asset }}" && rm -rf hushkey.app) ;;
          esac
          ls -l dist

      - name: The program starts (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/${{ matrix.asset }}
          ldd dist/${{ matrix.asset }}
          dist/${{ matrix.asset }} --version | grep -F "$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)"

      # Built here, where the runner's architecture is the package's.
      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          ver=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          bash rust/packaging/linux/build-deb.sh "$ver" "dist/${{ matrix.asset }}" dist

      - name: The .deb installs, runs and removes cleanly (Linux)
        if: runner.os == 'Linux'
        run: |
          deb=$(ls dist/hushkey_*.deb)
          sudo apt-get install -y "./$deb"
          test -x /usr/bin/hushkey
          /usr/bin/hushkey --version
          test -f /usr/share/applications/hushkey.desktop
          test -f /usr/lib/udev/rules.d/99-hushkey-uinput.rules
          # The upgrade path matters most: the Python package's leftovers
          # in system locations have to be gone.
          test ! -e /etc/udev/rules.d/99-whisper-ptt-uinput.rules
          sudo apt-get remove -y hushkey
          test ! -e /usr/bin/hushkey
          test ! -e /usr/share/applications/hushkey.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: deb-${{ matrix.asset }}
          path: dist/*.deb

  publish:
    # One job attaches everything: parallel uploads to a release that does
    # not exist yet race to create it.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          # The program assets the updater checks, and the packages beside
          # them, in one list.
          sha256sum hushkey-* hushkey_*.deb > SHA256SUMS
          cat SHA256SUMS

      # Which file to take is the first thing a reader needs; the generated
      # change list is appended below it by generate_release_notes.
      - name: Download table
        run: |
          ver="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          deb_amd64="$(cd artifacts && ls hushkey_*_amd64.deb 2>/dev/null | head -n1)"
          deb_arm64="$(cd artifacts && ls hushkey_*_arm64.deb 2>/dev/null | head -n1)"
          {
            echo "### Download"
            echo
            echo "One button per system on **[hushkey.eu](https://hushkey.eu)**, or here:"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| **Windows** 10+, 64-bit | [hushkey-windows-x86_64.exe]($base/hushkey-windows-x86_64.exe) |"
            [ -n "$deb_amd64" ] && echo "| **Linux** Debian/Ubuntu, 64-bit | [$deb_amd64]($base/$deb_amd64) |"
            [ -n "$deb_arm64" ] && echo "| **Linux** Debian/Ubuntu, ARM | [$deb_arm64]($base/$deb_arm64) |"
            echo "| **Linux** any distribution | [hushkey-linux-x86_64]($base/hushkey-linux-x86_64) · [aarch64]($base/hushkey-linux-aarch64) |"
            echo "| **macOS** Apple Silicon | [hushkey-macos-arm64.zip]($base/hushkey-macos-arm64.zip) |"
            echo "| **macOS** Intel | [hushkey-macos-x86_64.zip]($base/hushkey-macos-x86_64.zip) |"
            echo
            echo "Checksums: [SHA256SUMS]($base/SHA256SUMS). On Linux the \`.deb\`"
            echo "is the one to take unless your distribution is not Debian-based."
            echo
            echo "Already have hushkey? It offers the update itself."
            echo
            echo "---"
          } > release-body.md
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-body.md
          generate_release_notes: true
          files: |
            artifacts/hushkey-*
            artifacts/hushkey_*.deb
            artifacts/SHA256SUMS
