name: release

# The Rust app for every system, attached to the release of a v* tag
# (a pre-release when the tag has a suffix: v0.11.0-rc.1). The app updates
# itself from these assets, and install.ps1 / install.sh download them.
# Run by hand (workflow_dispatch) to build without publishing.

permissions:
  contents: write  # attaching the assets to the release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, asset: hushkey-windows-x86_64.exe, features: vulkan}
          # 22.04: the binary then runs on glibc 2.35 and newer
          - {os: ubuntu-22.04, asset: hushkey-linux-x86_64, features: vulkan}
          - {os: ubuntu-22.04-arm, asset: hushkey-linux-aarch64, features: vulkan}
          - {os: macos-15, asset: hushkey-macos-arm64.zip, features: metal}
          - {os: macos-15-intel, asset: hushkey-macos-x86_64.zip, features: metal}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Portable whisper.cpp: the CPU code must run on any user's machine,
      # not just on the runner's.
      GGML_NATIVE: "OFF"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Version matches the tag
        if: github.ref_type == 'tag'
        run: |
          crate=$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)
          test "v$crate" = "${GITHUB_REF_NAME}" || { echo "rust/Cargo.toml has $crate, tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev libasound2-dev libssl-dev pkg-config \
            libclang-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libudev-dev

      - uses: actions/cache/restore@v4
        id: shader-cache
        if: runner.os == 'Linux'
        with:
          path: .shader-tools
          key: shaderc-2025.1-vulkan-1.4.321-ubuntu22-${{ runner.arch }}-v1

      - name: Shader compiler (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/build-linux-shaders.sh

      - uses: actions/cache/save@v4
        if: runner.os == 'Linux' && steps.shader-cache.outputs.cache-hit != 'true'
        with:
          path: .shader-tools
          key: shaderc-2025.1-vulkan-1.4.321-ubuntu22-${{ runner.arch }}-v1

      - name: Vulkan SDK and libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk ninja -y --no-progress
          $sdk = (Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          # whisper.cpp's nested shader build overflows MAX_PATH under the
          # checkout; Ninja and a short target folder keep it short.
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=C:/t" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build
        working-directory: rust
        run: cargo build --release -p hushkey-app --features ${{ matrix.features }}

      - name: Package
        run: |
          mkdir -p dist
          target="${CARGO_TARGET_DIR:-rust/target}"
          case "${{ runner.os }}" in
            Windows) cp "$target/release/hushkey.exe" "dist/${{ matrix.asset }}" ;;
            Linux)   cp "$target/release/hushkey" "dist/${{ matrix.asset }}" ;;
            macOS)
              bash rust/packaging/macos/make-app.sh "$target/release/hushkey" dist
              (cd dist && ditto -c -k --keepParent hushkey.app "${{ matrix.asset }}" && rm -rf hushkey.app) ;;
          esac
          ls -l dist

      - name: The program starts (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/${{ matrix.asset }}
          ldd dist/${{ matrix.asset }}
          dist/${{ matrix.asset }} --version | grep -F "$(grep -m1 '^version' rust/Cargo.toml | cut -d'"' -f2)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    # One job attaches everything: parallel uploads to a release that does
    # not exist yet race to create it.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum hushkey-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/hushkey-*
            artifacts/SHA256SUMS
