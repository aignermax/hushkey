name: Vulkan

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Vulkan build tools and software driver
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build glslc libvulkan-dev mesa-vulkan-drivers libportaudio2
      - name: Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = (Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - name: Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Build and install pinned Vulkan engine
        run: python setup_vulkan.py --prefix .vulkan-ci --jobs 2
      - name: Windows native executable smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .vulkan-ci/bin/whisper-server.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests/test_whisper_cpp.py tests/test_setup_vulkan.py -v
      - name: Cache model
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: vulkan-ggml-tiny-v1
      - name: Linux real inference through software Vulkan
        if: runner.os == 'Linux'
        env:
          HUSHKEY_TEST_VULKAN: '1'
          WHISPER_CPP_SERVER: .vulkan-ci/bin/whisper-server
        run: python -m pytest tests/test_vulkan_e2e.py -v
