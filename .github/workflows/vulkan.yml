name: Native engines
on:
  workflow_call:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, system: windows, arch: x64}
          - {os: ubuntu-22.04, system: linux, arch: x64}
          - {os: ubuntu-22.04-arm, system: linux, arch: arm64}
          - {os: macos-15, system: macos, arch: arm64}
          - {os: macos-15-intel, system: macos, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Vulkan build tools and runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build glslc libvulkan-dev spirv-headers mesa-vulkan-drivers libportaudio2
      - name: Windows Vulkan SDK (build machines only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = (Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "$sdk\Bin" >> $env:GITHUB_PATH
      - name: Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Build portable pinned engine
        run: python setup_vulkan.py --prefix .vulkan-ci --jobs 3
      - name: Native executable smoke test
        shell: bash
        run: |
          binary=.vulkan-ci/bin/whisper-server
          [ "$RUNNER_OS" != Windows ] || binary="$binary.exe"
          "$binary" --help
          if [ "$RUNNER_OS" = Linux ]; then
            ldd "$binary" | tee native-dependencies.txt
            ! grep -q 'not found' native-dependencies.txt
            ! grep -Eq 'libstdc\+\+|libgomp|libgcc_s' native-dependencies.txt
          elif [ "$RUNNER_OS" = macOS ]; then
            otool -L "$binary" | tee native-dependencies.txt
            ! tail -n +2 native-dependencies.txt | grep -Eq '/opt/homebrew|/usr/local|\.vulkan-ci'
          fi
      - name: Native CPU rejection and Unicode paths
        if: runner.os != 'macOS'
        shell: bash
        run: |
          export HUSHKEY_TEST_CPP_BINARY=1
          export WHISPER_CPP_SERVER="$PWD/.vulkan-ci/bin/whisper-server"
          [ "$RUNNER_OS" != Windows ] || export WHISPER_CPP_SERVER="$WHISPER_CPP_SERVER.exe"
          python -m pytest tests/test_vulkan_e2e.py -v
      - name: Linux real inference through software Vulkan
        if: runner.os == 'Linux'
        env:
          HUSHKEY_TEST_VULKAN: '1'
          WHISPER_CPP_SERVER: .vulkan-ci/bin/whisper-server
          GGML_VK_VISIBLE_DEVICES: '0'
        run: python -m pytest tests/test_vulkan_e2e.py -v
      - name: Package engine with licenses
        run: python packaging/native.py --prefix .vulkan-ci --system ${{ matrix.system }} --arch ${{ matrix.arch }} --out native
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.system }}-${{ matrix.arch }}
          path: native/*.zip
          if-no-files-found: error
  bundles:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: native
          merge-multiple: true
      - name: Generate integrity manifest
        run: python packaging/native.py --out native --manifest v0.9.0
      - uses: actions/upload-artifact@v4
        with:
          name: native-bundles
          path: native/*
          if-no-files-found: error
